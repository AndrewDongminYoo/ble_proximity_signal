name: ble_proximity_signal

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/ble_proximity_signal.yaml
      - ble_proximity_signal/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/ble_proximity_signal.yaml
      - ble_proximity_signal/**

jobs:
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      config: cspell.json
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      flutter_version: 3.47.8
      format_line_length: 120
      working_directory: ble_proximity_signal

  android:
    # Linux + KVM is the runner the android-emulator-runner README recommends for
    # hardware-accelerated emulators. The previous macos-latest runners are now
    # Apple Silicon, where the emulator fails before boot (sdkmanager step), so
    # the AVD never starts.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ble_proximity_signal/example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0

      - name: Install Fluttium
        run: flutter pub global activate fluttium_cli

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-linux

      - name: Cache AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: E2E Tests
        # Non-blocking: fluttium (last release 2023-08, unmaintained) fails to
        # attach its test driver on the Android emulator ("Failed to start test
        # driver"). The same fluttium version passes the iOS smoke test, so this
        # is the tool's Android path, not the app. UI smoke is covered on iOS;
        # real Android BLE is only testable on a physical device (Patrol).
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          script: fluttium test flows/test_platform_name.yaml -d android
          working-directory: ble_proximity_signal/example

  ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ble_proximity_signal/example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0

      - name: Install Fluttium
        run: flutter pub global activate fluttium_cli

      - name: Start Simulator
        # Start an iPhone simulator
        run: |
          UDID=$(xcrun xctrace list devices | grep "^iPhone" | awk '{gsub(/[()]/,""); print $NF}' | head -n 1)
          echo $UDID
          xcrun simctl boot "${UDID:?No Simulator with this name found}"

      - name: E2E Tests
        run: fluttium test flows/test_platform_name.yaml -d iPhone
